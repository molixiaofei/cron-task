# 工作流名称
name: 定时任务

# 触发条件
on:
  schedule:
    # 每天北京时间上午8点执行 (UTC时间 0:00)
    - cron: '0 0 * * *'   # 👈 改了：0点UTC = 8点北京时间
  workflow_dispatch:        # 👈 新增：支持手动触发

# 定义任务
jobs:
  visit-url:
    name: Visit URL
    runs-on: ubuntu-latest

    steps:
      - name: Execute curl request
        run: |
          echo "开始执行定时任务..."
          curl -L -m 30 'https://www.55dui.com/api/cron.php?action=all&secret=BzTeam2024Secure!'
          echo "定时任务执行完成"
